name: smoke-baseline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff mypy

      - name: Run static checks
        run: |
          python -m ruff check --no-cache project tests
          python -m mypy --no-sqlite-cache --cache-dir .mypy_cache_ci --follow-imports=skip project/core/models.py project/algorithms/schedulers.py project/simulation/context.py project/simulation/mas.py project/simulation/loop.py project/experiments/manifest.py project/experiments/smoke.py project/experiments/performance_budget.py

      - name: Run tests
        run: |
          python -m pytest -q

      - name: Run smoke baseline against golden
        run: |
          python -B -m project.experiments.smoke --config config.yaml

      - name: Run scalability performance budget gate
        run: |
          python -B -m project.experiments.performance_budget --config config.yaml --nodes 10 --tasks 100 --algorithms min-load,greedy --repeats 1 --topology ring --scenario static --max-runtime-seconds 1.0 --min-throughput 0.05 --max-pending-tasks 500

  mutation-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff mypy

      - name: Run mutation baseline gate
        run: |
          python -B -m project.quality.mutation_baseline --output docs/baselines/mutation_baseline.ci.json --fail-on-survivors
