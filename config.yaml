name: sprint3-control-algorithms
scenario: static

simulation:
  time_horizon: 8
  seed: 42
  step_seconds: 1.0

optimization:
  algorithm: min-load
  compare_algorithms:
    - round-robin
    - min-load
    - greedy

nodes:
  - id: node-a
    cpu: 16
    memory: 64
    gpu: 1
    load: 0.10
  - id: node-b
    cpu: 12
    memory: 32
    gpu: 0
    load: 0.15

network_edges:
  - source: node-a
    target: node-b
    bandwidth: 1000
    latency: 4
  - source: node-b
    target: node-a
    bandwidth: 1000
    latency: 4

initial_tasks:
  - id: task-1
    cpu_required: 2
    memory_required: 4
    data_size: 128
    deadline: 6
    arrival_time: 0
    duration: 2
  - id: task-2
    cpu_required: 6
    memory_required: 8
    data_size: 256
    deadline: 7
    arrival_time: 1
    duration: 3
  - id: task-3
    cpu_required: 4
    memory_required: 6
    data_size: 180
    deadline: 5
    arrival_time: 2
    duration: 2
